<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · EasyHome</title>
    <meta name="theme-color" content="#ffd60a" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(600px 400px at 80% 0%, rgba(255, 214, 10, 0.35), transparent 65%),
          #fffdf4;
        color: #141414;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: min(460px, 100%);
        padding: 32px 28px;
        border: 1px solid rgba(20, 20, 20, 0.08);
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 30px 80px rgba(20, 20, 20, 0.12);
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #ffd60a;
        font-size: 30px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(24px, 6vw, 30px);
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 0 22px;
        color: #5f5f5f;
        font-size: 14.5px;
        line-height: 1.6;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #141414;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      button:hover,
      a:hover {
        background: #2a2a2a;
      }
      .hint {
        margin-top: 16px;
        margin-bottom: 0;
        color: #8a8a8a;
        font-size: 11.5px;
      }
      .logo {
        width: 38px;
        height: 38px;
        object-fit: contain;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icon-192.png" alt="EasyHome" />
      <div class="mark" aria-hidden="true">⚡</div>
      <h1>You are offline</h1>
      <p>
        EasyHome needs a connection to load new jobs and bookings. Your cached data is safe —
        reconnect and everything will sync automatically.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="hint">Tip: previously opened pages keep working from the offline cache.</p>
    </main>
  </body>
</html>
